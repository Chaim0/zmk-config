name: Draw keymap
on:
  push:
    paths:
      - "config/*.keymap"
      - "keymap_drawer.config.yaml"
      - ".github/workflows/draw-keymap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install keymap-drawer
        run: pip install keymap-drawer

      - name: Parse and draw one SVG per layer
        run: |
          mkdir -p keymap-drawer
          rm -f keymap-drawer/*.svg
          CFG=()
          [ -f keymap_drawer.config.yaml ] && CFG=(-c keymap_drawer.config.yaml)
          keymap "${CFG[@]}" parse -z config/corne.keymap > keymap-drawer/corne.yaml
          python - <<'PY' > /tmp/layers.txt
          import yaml
          print("\n".join(yaml.safe_load(open("keymap-drawer/corne.yaml"))["layers"]))
          PY
          while read -r layer; do
            keymap "${CFG[@]}" draw keymap-drawer/corne.yaml -s "$layer" -o "keymap-drawer/$layer.svg"
          done < /tmp/layers.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keymap-drawer
          git diff --cached --quiet && exit 0
          git commit -m "chore: update keymap drawings"
          git push
